<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stellar View — Catálogo Astronómico</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fuente Orbitron/Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@500;700;900&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Encabezado Principal -->
  <header class="header">
    <div class="header-container">
      <div class="brand">
        <span class="satellite-icon">🛰️</span>
        <h1 class="logo-text">STELLAR <span class="accent">VIEW</span></h1>
      </div>
      <div class="status-badge" id="api-status">
        <span class="status-dot pulsing"></span>
        <span class="status-text">Conectando a ORBIT...</span>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="main-content">
    <section class="hero-section">
      <h2 class="section-title">Objetos Astronómicos Registrados</h2>
      <p class="section-subtitle">Sincronizado en tiempo real desde la API de ORBIT Core.</p>
    </section>

    <!-- Error Banner (Oculto por defecto) -->
    <div id="error-banner" class="error-banner hidden">
      <span class="error-icon">⚠️</span>
      <p id="error-message">No se pudo establecer conexión con el backend de ORBIT.</p>
    </div>

    <!-- Galería Grid -->
    <section id="objects-grid" class="objects-grid">
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
    </section>

    <!-- Sección de Astrofotografía y Artículos -->
    <section id="publications-section" class="container">
      <h2>Artículos y publicaciones</h2>
      <div id="publications-grid" class="grid-container" aria-live="polite">
        <p>Cargando publicaciones…</p>
      </div>
    </section>

    <section id="gallery-section" class="container">
      <h2>📸 Galería de astrofotografía</h2>
      <form id="gallery-upload-form" class="gallery-form">
        <h3>Comparte una fotografía</h3>
        <div class="gallery-form-fields">
          <label>Título *<input name="title" maxlength="120" required placeholder="Ej. Nebulosa de Orión"></label>
          <label>Objeto astronómico<input name="object_name" maxlength="120" placeholder="Ej. M42"></label>
          <label>Autor<input name="author" maxlength="120" placeholder="Tu nombre"></label>
          <label>Equipo utilizado<input name="equipment" maxlength="200" placeholder="Telescopio, cámara…"></label>
          <label class="gallery-file">Fotografía * (JPG, PNG, WEBP o GIF; máximo 5 MB)<input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required></label>
        </div>
        <button type="submit">Subir fotografía</button>
        <p id="gallery-upload-status" class="upload-status" role="status" aria-live="polite"></p>
      </form>
      <div id="gallery-grid" class="grid-container">
        <!-- Las fotografías compartidas se cargan desde ORBIT -->
      </div>
    </section>
  </main>

  <script src="app.js"></script>

</body>

</html>
